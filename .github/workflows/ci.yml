# 每次推送 / 提 PR 时自动校验 Cask 的语法、风格与下载完整性。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Style check (brew style)
        run: brew style ./Casks/*.rb

      # setup-homebrew 检测到本仓库是 tap（homebrew-* 且根目录含 Casks/），
      # 已自动用符号链接把仓库注册为 tap —— 直接按名称审计即可。
      # 不要再 brew tap "$PWD"：会把符号链接替换成真实目录，
      # 导致该 action 的 post 清理脚本 rm 失败（前两次 CI 失败的根源）。
      # --online 会真实下载安装包并核对 sha256，能尽早发现 Release 资产问题。
      - name: Audit (brew audit --cask --online)
        env:
          # 认证 GitHub API，避免 runner 共享 IP 被限流
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAP="${{ steps.setup-homebrew.outputs.tap-name }}"
          if [ -z "$TAP" ]; then
            # 兜底：action 未自动注册时才手动 tap
            TAP="OTOHARiRiSA/deepseek-harness-desktop"
            brew tap "$TAP" "$PWD"
          fi
          brew audit --cask --online "$TAP/deepseek-harness-desktop"
