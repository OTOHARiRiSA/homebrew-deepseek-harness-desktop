# 可选：每次推送 / 提 PR 时自动校验 Cask 的语法、风格与下载完整性。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Style check (brew style)
        run: brew style ./Casks/*.rb

      # --online 会真实下载安装包并核对 sha256，能尽早发现 Release 资产问题
      - name: Audit (brew audit --cask --online)
        run: brew audit --cask --online ./Casks/*.rb
