# 每次推送 / 提 PR 时自动校验 Cask 的语法、风格与下载完整性。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: setup-homebrew
        # 固定 SHA（2026.07.10.1）；master 分支同步已停止，未固定会在
        # Homebrew 5.2.0 起直接报错
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Style check (brew style)
        run: brew style ./Casks/*.rb

      # setup-homebrew 检测到本仓库是 tap（homebrew-* 且根目录含 Casks/），
      # 已自动用符号链接把仓库注册为 tap —— 直接按名称审计即可。
      # 不要再 brew tap "$PWD"：会把符号链接替换成真实目录，
      # 导致该 action 的 post 清理脚本 rm 失败（前两次 CI 失败的根源）。
      # --online 会真实下载安装包并核对 sha256，能尽早发现 Release 资产问题。
      - name: Audit (brew audit --cask --online)
        env:
          # 认证 GitHub API，避免 runner 共享 IP 被限流
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAP="${{ steps.setup-homebrew.outputs.tap-name }}"
          if [ -z "$TAP" ]; then
            # 兜底：action 未自动注册时才手动 tap。
            # 注意：某些版本（如 2026.07.10.1）会自动注册 tap 但
            # 不输出 tap-name，此时再 `brew tap ... "$PWD"` 会报
            # remote mismatch；已注册就直接复用。
            TAP="OTOHARiRiSA/deepseek-harness-desktop"
            # `brew tap`（无参数）才是列出已安装 tap 的写法；`--list` 已不支持
            brew tap | grep -qi "otoharirisa/deepseek-harness-desktop" \
              || brew tap "$TAP" "$PWD"
          fi
          brew audit --cask --online "$TAP/deepseek-harness-desktop"
