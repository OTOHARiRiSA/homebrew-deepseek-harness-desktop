# 每次推送 / 提 PR 时自动校验 Cask 的语法、风格与下载完整性。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Style check (brew style)
        run: brew style ./Casks/*.rb

      # Homebrew 6 的 audit 只接受 tap 内的 cask 名称，不接受文件路径：
      # 先把本仓库注册为本地 tap，再按名称审计。
      # --online 会真实下载安装包并核对 sha256，能尽早发现 Release 资产问题。
      - name: Tap repo & audit (brew audit --cask --online)
        run: |
          brew tap OTOHARiRiSA/deepseek-harness-desktop "$PWD"
          brew audit --cask --online OTOHARiRiSA/deepseek-harness-desktop/deepseek-harness-desktop
